# Release pipeline for PlanTwin. Written for review. It runs only on a version tag, and this repository has not pushed one.
# Least privilege per job. Signing is keyless (Sigstore, via the job's OIDC identity), so no signing key is stored.
name: release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

jobs:
  binaries:
    name: CLI binaries and checksums
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Build static binaries (Go in the pinned golang image)
        run: |
          mkdir -p dist
          for target in linux/amd64 linux/arm64 darwin/arm64; do
            os=${target%/*}; arch=${target#*/}
            docker run --rm --user "$(id -u):$(id -g)" -e HOME=/tmp -e GOCACHE=/tmp/gocache -e CGO_ENABLED=0 \
              -e GOOS=$os -e GOARCH=$arch -v "$PWD":/src -w /src golang:1.24 \
              go build -buildvcs=false -trimpath -ldflags "-s -w -X main.Version=${GITHUB_REF_NAME}" \
              -o dist/plantwin_${os}_${arch} ./cmd/plantwin
          done
      - name: Archive and checksum
        run: |
          cd dist
          cp plantwin_linux_amd64 plantwin && tar -czf plantwin_linux_amd64.tar.gz plantwin && rm plantwin
          sha256sum plantwin_* > checksums.txt
          ls -l
      - uses: actions/upload-artifact@v4
        with:
          name: binaries
          path: dist/

  sign:
    name: Sign checksums (keyless)
    needs: binaries
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: binaries
          path: dist
      - uses: sigstore/cosign-installer@v3
      - name: Sign the checksum file
        run: cosign sign-blob --yes dist/checksums.txt --output-signature dist/checksums.txt.sig --output-certificate dist/checksums.txt.pem
      - name: Attach to the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --title "$GITHUB_REF_NAME" --notes-file CHANGELOG.md

  image:
    name: Multi-architecture twin image (GHCR)
    needs: binaries
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          target: final
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/plantwin-postgres:18,ghcr.io/${{ github.repository_owner }}/plantwin-postgres:${{ github.ref_name }}
