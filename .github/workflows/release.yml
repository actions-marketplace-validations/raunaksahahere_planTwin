# Release pipeline. Runs when a tag matching v*.*.* is pushed. The release job refuses tags with no CHANGELOG section.
# Least privilege per job; third-party actions pinned to commit SHAs; signing is keyless (Sigstore, via the job's
# OIDC identity), so no signing key is stored anywhere.
name: release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

jobs:
  binaries:
    name: CLI binaries and checksums
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Build static binaries (Go runs in the pinned golang image)
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          mkdir -p dist "$HOME/.cache/plantwin-go"
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64; do
            os="${target%/*}"
            arch="${target#*/}"
            docker run --rm --user "$(id -u):$(id -g)" \
              -e HOME=/tmp -e GOPATH=/tmp/go -e GOCACHE=/tmp/gocache -e CGO_ENABLED=0 \
              -e GOOS="$os" -e GOARCH="$arch" \
              -v "$PWD":/src -v "$HOME/.cache/plantwin-go":/tmp/go -w /src \
              golang:1.24 \
              go build -buildvcs=false -trimpath -ldflags "-s -w -X main.Version=${VERSION#v}" \
              -o "dist/plantwin_${os}_${arch}" ./cmd/plantwin
          done
      - name: Archive and checksum
        run: |
          set -euo pipefail
          cd dist
          # One tarball per Linux architecture, named as the Action expects. Each holds a single file: plantwin.
          for arch in amd64 arm64; do
            mkdir pkg
            cp "plantwin_linux_${arch}" pkg/plantwin
            tar -C pkg -czf "plantwin_linux_${arch}.tar.gz" plantwin
            rm -rf pkg
          done
          sha256sum plantwin_linux_amd64.tar.gz plantwin_linux_arm64.tar.gz \
            plantwin_linux_amd64 plantwin_linux_arm64 plantwin_darwin_amd64 plantwin_darwin_arm64 > checksums.txt
          cat checksums.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: binaries
          path: dist/
          if-no-files-found: error

  release:
    name: Sign checksums and publish the GitHub Release
    needs: binaries
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write   # create the release and upload assets
      id-token: write   # keyless signing (Sigstore)
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: binaries
          path: dist
      - uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac # v3
      - name: Sign the checksum file (keyless)
        run: |
          set -euo pipefail
          cosign sign-blob --yes dist/checksums.txt \
            --output-signature dist/checksums.txt.sig \
            --output-certificate dist/checksums.txt.pem
      - name: Release notes from CHANGELOG.md
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          awk -v v="${VERSION#v}" '
            $0 ~ "^## \\[" v "\\]" { keep = 1; next }
            /^## \[/ { keep = 0 }
            keep' CHANGELOG.md > release-notes.md
          test -s release-notes.md || { echo "CHANGELOG.md has no section for ${VERSION}" >&2; exit 1; }
      - name: Create the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          gh release create "$VERSION" dist/* --verify-tag --title "PlanTwin $VERSION" --notes-file release-notes.md

  image:
    name: Multi-architecture twin image (GHCR), signed
    needs: binaries
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write   # push to GHCR
      id-token: write   # keyless signing of the image digest
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          target: final
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/plantwin-postgres:18
            ghcr.io/${{ github.repository_owner }}/plantwin-postgres:${{ github.ref_name }}
      - uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac # v3
      - name: Sign the image digest (keyless)
        env:
          IMAGE: ghcr.io/${{ github.repository_owner }}/plantwin-postgres
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          cosign sign --yes "${IMAGE}@${DIGEST}"
