# CI for PlanTwin. Least privilege: read-only token. Triggered by pull requests and pushes to main; never pull_request_target.
# Third-party actions are pinned to commit SHAs. No secrets are used.
name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  go:
    name: Go vet, format and unit tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Format, vet and unit tests (Go runs in the pinned golang image)
        run: make check

  extension:
    name: Extension (PostgreSQL ${{ matrix.pg_image }})
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # Minor versions are checked, not only the major. Tags verified on Docker Hub: 18.6 and 18.4 exist; 18.5 does not.
        pg_image: [postgres:18.6, postgres:18.4]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: pg_regress for the extension
        run: |
          docker build --build-arg PG_IMAGE=${{ matrix.pg_image }} --target test -t plantwin-ext-test .

  integration:
    name: Integration (real Docker, PostgreSQL 18)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    needs: [go, extension]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Demo, redaction and least-privilege role tests
        run: make test-integration
