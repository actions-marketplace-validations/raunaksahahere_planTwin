# CI for PlanTwin itself. Written for review; not triggered by this repository's maintainers yet.
# Least privilege: read-only token. No pull_request_target. No secrets are used.
name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  go:
    name: Go vet, format and unit tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Format, vet and unit tests (Go runs in the pinned golang image)
        run: make check

  extension:
    name: Extension (PostgreSQL ${{ matrix.pg_image }})
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # Minor versions are checked, not only the major. Confirm these tags exist before relying on the matrix.
        pg_image: [postgres:18.6, postgres:18.5]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: pg_regress for the extension
        run: |
          docker build --build-arg PG_IMAGE=${{ matrix.pg_image }} --target test -t plantwin-ext-test .

  integration:
    name: Integration (real Docker, PostgreSQL 18)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    needs: [go, extension]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Demo, redaction and least-privilege role tests
        run: make test-integration
