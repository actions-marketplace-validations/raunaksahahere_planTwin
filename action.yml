name: PlanTwin check
description: Compare PostgreSQL query plans between a base and a head revision, using a signed production stats bundle.
author: PlanTwin contributors

inputs:
  version:
    description: PlanTwin release to install (a tag such as v1.0.0). The checksum is verified before use.
    required: false
    default: v1.0.0
  base:
    description: Base git ref. Pass the pull request's base branch, for example origin/main.
    required: true
  head:
    description: Head git ref. Use HEAD for the checked-out pull request.
    required: false
    default: HEAD
  config:
    description: Path to plantwin.yaml in the repository.
    required: false
    default: plantwin.yaml
  format:
    description: Report format written to the report file (md, json or sarif).
    required: false
    default: md
  report:
    description: File the report is written to.
    required: false
    default: plantwin-report.md

branding:
  icon: database
  color: blue

outputs:
  report:
    description: Path to the report file.
    value: ${{ inputs.report }}

runs:
  using: composite
  steps:
    - name: Install PlanTwin (checksum verified)
      shell: bash
      env:
        PT_VERSION: ${{ inputs.version }}
      run: |
        set -euo pipefail
        # Pick the build for this runner. Runners are amd64 or arm64; anything else has no build.
        case "$(uname -m)" in
          x86_64|amd64)   arch=amd64 ;;
          aarch64|arm64)  arch=arm64 ;;
          *) echo "PlanTwin has no Linux build for $(uname -m). Supported: x86_64, aarch64." >&2; exit 1 ;;
        esac
        asset="plantwin_linux_${arch}.tar.gz"
        base_url="https://github.com/${GITHUB_ACTION_REPOSITORY:-raunaksahahere/planTwin}/releases/download/${PT_VERSION}"
        # Install outside the repository, so the tarball and checksum file are never left in the checkout.
        install_dir="${RUNNER_TEMP}/plantwin-install"
        rm -rf "$install_dir"
        mkdir -p "$install_dir"
        cd "$install_dir"
        # The file must keep the name the checksum file lists: sha256sum -c looks it up by name.
        curl -fsSL -O "${base_url}/${asset}"
        curl -fsSL -o checksums.txt "${base_url}/checksums.txt"
        grep " ${asset}$" checksums.txt | sha256sum -c -
        tar -xzf "${asset}" plantwin
        "$install_dir/plantwin" version

    - name: Run the check
      shell: bash
      env:
        PT_BASE: ${{ inputs.base }}
        PT_HEAD: ${{ inputs.head }}
        PT_CONFIG: ${{ inputs.config }}
        PT_FORMAT: ${{ inputs.format }}
        PT_REPORT: ${{ inputs.report }}
      run: |
        set +e
        "${RUNNER_TEMP}/plantwin-install/plantwin" check --config "$PT_CONFIG" --base "$PT_BASE" --head "$PT_HEAD" --format "$PT_FORMAT" --out "$PT_REPORT"
        status=$?
        if [ -f "$PT_REPORT" ] && [ "$PT_FORMAT" = "md" ]; then
          cat "$PT_REPORT" >> "$GITHUB_STEP_SUMMARY"
        fi
        exit $status
